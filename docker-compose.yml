services:
  postgres:
    image: postgres:16-alpine
    container_name: lf-postgres
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5435:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lf-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://lf-redis:6379
      - DATABASE_URL=postgresql://lectureflow:lectureflow_dev@lf-postgres:5432/lectureflow
    depends_on:
      - postgres
      - redis

volumes:
  redisdata: